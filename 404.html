<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac Bid Checker has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://yinzbidz.app/app/">
<noscript><meta http-equiv="refresh" content="0;url=https://yinzbidz.app/app/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  h1 { color: #FFB81C; font-size: 1.3rem; margin: 0 0 10px; }
  p { color: #999; margin: 0 0 14px; font-size: .95rem; }
  a { color: #FFB81C; font-weight: 700; }
</style>
</head>
<body>
<div>
  <h1>Mac Bid Checker moved</h1>
  <p>New address: <a id="link" href="https://yinzbidz.app/app/">yinzbidz.app</a></p>
  <p>Taking you there now, saved items and all&hellip;</p>
</div>
<script>
(function() {
  var NEW = 'https://yinzbidz.app/app';
  // Keep the same page (live or /beta/) and any ?b=…&l=… numbers in the link.
  var path = location.pathname.replace(/^\/macbid-calc/, '') || '/';
  var dest = NEW + path + location.search;
  document.getElementById('link').href = dest;

  // Hand the visitor's saved data (My List, Day Total, settings) to the new address in the URL hash.
  var payload = {}, n = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('macbid-') === 0) { payload[k] = localStorage.getItem(k); n++; }
    }
  } catch (e) {}
  var hash = '';
  try {
    var enc = encodeURIComponent(JSON.stringify(payload));
    if (n && enc.length < 60000) hash = '#migrate=' + enc;
  } catch (e) {}

  var gone = false;
  var go = function() { if (gone) return; gone = true; location.replace(dest + hash); };

  // Tear down the old offline cache so installed copies stop serving the old app.
  var cleanup = [];
  if ('serviceWorker' in navigator) {
    cleanup.push(navigator.serviceWorker.getRegistrations().then(function(rs) {
      return Promise.all(rs.map(function(r) { return r.unregister(); }));
    }).catch(function() {}));
  }
  if (window.caches) {
    cleanup.push(caches.keys().then(function(ks) {
      return Promise.all(ks.map(function(k) { return caches.delete(k); }));
    }).catch(function() {}));
  }
  Promise.all(cleanup).then(go, go);
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
